<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Books</title>
<style>
  :root{
    --bg:#f4efe6; --paper:#fffdf8; --ink:#2b2622; --muted:#7a6f64;
    --accent:#c2562b; --accent-soft:#f3d9cb; --line:#e4dccd;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d1a17; --paper:#262220; --ink:#efe8dd; --muted:#a99d90;
           --accent:#e8845a; --accent-soft:#4a3226; --line:#3a332d; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    display:flex; justify-content:center; padding:20px 14px 40px;
  }
  .book{width:100%; max-width:680px}
  header{text-align:center; margin-bottom:14px}
  header h1{margin:0; font-size:1.5rem}
  header p{margin:6px 0 0; color:var(--muted); font-family:system-ui,sans-serif; font-size:.9rem}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:0 0 14px; font-family:system-ui,sans-serif}
  .tab{
    background:var(--paper); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:7px 14px; font-size:.88rem; cursor:pointer;
  }
  .tab.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .page{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; min-height:320px; box-shadow:0 6px 24px rgba(0,0,0,.08);
  }
  .page h2{margin:0 0 14px; font-size:.95rem; color:var(--accent); font-family:system-ui,sans-serif;
    letter-spacing:.06em; text-transform:uppercase}
  .page p{font-size:1.25rem; line-height:2; margin:0}
  .w{
    cursor:pointer; border-radius:5px; padding:1px 1px;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  .w:hover{background:var(--accent-soft)}
  .w.active{background:var(--accent); color:#fff}
  .nav{display:flex; align-items:center; justify-content:space-between; margin-top:16px; font-family:system-ui,sans-serif}
  .nav button{
    background:var(--accent); color:#fff; border:0; border-radius:10px;
    padding:10px 18px; font-size:1rem; cursor:pointer;
  }
  .nav button:disabled{opacity:.35; cursor:default}
  .dots{display:flex; gap:8px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--line)}
  .dot.on{background:var(--accent)}
  .learned{
    margin-top:18px; background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; font-family:system-ui,sans-serif; font-size:.92rem;
  }
  .learned b{color:var(--accent)}
  #list{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}
  .chip{background:var(--accent-soft); border-radius:999px; padding:3px 10px}
  #tip{
    position:fixed; z-index:10; pointer-events:none; opacity:0; transform:translateY(4px);
    transition:opacity .12s, transform .12s;
    background:#2b2622; color:#fff; padding:8px 14px; border-radius:10px;
    font-family:system-ui,sans-serif; font-size:1.05rem; white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  #tip.show{opacity:1; transform:none}
  #tip small{display:block; opacity:.6; font-size:.72rem}
</style>
</head>
<body>
<div class="book">
  <header>

</div>

const HOLD_MS = 350;
const tip = document.getElementById("tip");
const pageEl = document.getElementById("page");
const dotsEl = document.getElementById("dots");
const seen = new Set();
let book = 0, current = 0, timer = null, hideTimer = null, activeEl = null;

function norm(w){ return w.toLowerCase().replace(/['’]s$/, ""); }

function buildDots(){
  dotsEl.replaceChildren();
  BOOKS[book].pages.forEach(()=>{
    const d = document.createElement("div"); d.className = "dot"; dotsEl.appendChild(d);
  });
}

function render(){
  const pages = BOOKS[book].pages;
  const h = document.createElement("h2");
  h.textContent = BOOKS[book].name + " · " + (current+1) + "/" + pages.length;
  const para = document.createElement("p");
  pages[current].split(/([A-Za-z]+(?:['’][a-z]+)?)/).forEach(part=>{
    if(/^[A-Za-z]/.test(part)){
      const s = document.createElement("span");
      s.className = "w"; s.textContent = part; s.dataset.k = norm(part);
      para.appendChild(s);
    } else para.appendChild(document.createTextNode(part));
  });
  pageEl.replaceChildren(h, para);
  document.getElementById("prev").disabled = current===0;
  document.getElementById("next").disabled = current===pages.length-1;
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("on", i===current));
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("on", i===book));
  hideTip();
}

function showTip(el){
  const k = el.dataset.k;
  const mn = DICT[k] || "(орчуулга олдсонгүй)";
  tip.innerHTML = mn + "<small>" + el.textContent + "</small>";
  const r = el.getBoundingClientRect();
  tip.classList.add("show");
  const tw = tip.offsetWidth;
  let left = Math.min(Math.max(8, r.left + r.width/2 - tw/2), window.innerWidth - tw - 8);
  let top = r.top - tip.offsetHeight - 10;
  if(top < 8) top = r.bottom + 10;
  tip.style.left = left + "px"; tip.style.top = top + "px";
  el.classList.add("active"); activeEl = el;
  if(DICT[k] && !seen.has(k)){
    seen.add(k);
    document.getElementById("count").textContent = seen.size;
    const c = document.createElement("span"); c.className = "chip";
    c.textContent = el.textContent.toLowerCase() + " = " + DICT[k];
    document.getElementById("list").appendChild(c);
  }
}
function hideTip(){
  tip.classList.remove("show");
  if(activeEl){ activeEl.classList.remove("active"); activeEl = null; }
}
function cancel(){ clearTimeout(timer); timer = null; }

pageEl.addEventListener("pointerdown", e=>{
  const el = e.target.closest(".w"); if(!el) return;
  clearTimeout(hideTimer); hideTip(); cancel();
  timer = setTimeout(()=>{ showTip(el); timer = null; }, HOLD_MS);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  pageEl.addEventListener(ev, ()=>{
    cancel();
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideTip, 1200);
  });
});
pageEl.addEventListener("contextmenu", e=>e.preventDefault());

const tabs = document.getElementById("tabs");
BOOKS.forEach((b,i)=>{
  const t = document.createElement("button");
  t.className = "tab"; t.textContent = b.mn;
  t.onclick = ()=>{ book = i; current = 0; buildDots(); render(); };
  tabs.appendChild(t);
});

document.getElementById("prev").onclick = ()=>{ if(current>0){ current--; render(); } };
document.getElementById("next").onclick = ()=>{ if(current<BOOKS[book].pages.length-1){ current++; render(); } };
buildDots();
render();
</script>
</body>
</html>
